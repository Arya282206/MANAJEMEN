<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TM25 Manajemen</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#ececec;
      font-family:'Poppins', sans-serif;
      display:flex;
      justify-content:center;
      min-height:100vh;
    }

    .mobile-container{
      width:100%;
      max-width:390px;
      background:#ffffff;
      min-height:100vh;
      padding:20px 16px;
      overflow-y:auto;
    }

    /* HEADER */
    .header-title{
      text-align:left;
      margin-bottom:20px;
    }

    .header-title img{
      width:200%;
      max-width:250px;
      object-fit:contain;
    }

    /* MENU */
    .menu-box{
      background:#000;
      color:#fff;
      border-radius:16px;
      padding:14px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:24px;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
    }

    .menu-title{
      font-size:18px;
      font-weight:600;
      letter-spacing:0.3px;
      margin-left:10px;
    }

    .menu-box button{
      border:none;
      background:#fff;
      color:#000;
      padding:7px 18px;
      border-radius:10px;
      font-size:13px;
      font-weight:600;
      transition:0.3s ease;
    }

    .menu-box button:hover{
      background:#d9d9d9;
    }

    /* CARD */
    .project-card{
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      margin-bottom:22px;
      box-shadow:0 4px 14px rgba(0,0,0,0.08);
      transition:0.3s ease;
    }

    .project-card:hover{
      transform:translateY(-3px);
      box-shadow:0 6px 18px rgba(0,0,0,0.12);
    }

    .project-card img{
      width:100%;
      height:210px;
      object-fit:cover;
      display:block;
    }

    .project-content{
      padding:14px 16px;
    }

    .project-info{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .project-title{
      font-size:17px;
      font-weight:600;
      color:#111;
    }

    .project-year{
      font-size:13px;
      color:#777;
      font-weight:500;
    }

    /* FOOTER */
    .footer{
      margin-top:30px;
      padding:20px 10px;
      background:#ffffff;
      border-radius:18px;
      text-align:center;
      color:#fff;
    }

    .footer-title{
      font-size:15px;
      font-weight:600;
      margin-bottom:14px;
      letter-spacing:1px;
    }

    .social-icons{
      display:flex;
      justify-content:center;
      gap:120px;
    }

    .social-icons a{
      color:#000000;
      font-size:24px;
      transition:0.3s ease;
    }

    .social-icons a:hover{
      transform:scale(1.2);
      color:#000000;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width:400px){
      .mobile-container{
        padding:16px 12px;
      }

      .project-card img{
        height:190px;
      }
    }
  </style>
</head>

<body>

  <div class="mobile-container">

    <!-- HEADER -->
    <div class="header-title">
      <img src="5.png" alt="Logo TM25">
    </div>

    <!-- MENU -->
    <div class="menu-box">
      <div class="menu-title">
        ✿ TM 25 MANAJEMEN A
      </div>

      <a href="Page1.html">
        <button type="button">View</button>
      </a>
    </div>

          <div class="project-title">SAVAGESCHOLAR</div>

        </div>
      </div>
    </div>

    <!-- CARD 2 -->

          <div class="project-title">SAVAGESCHOLAR</div>

        </div>
      </div>

    <!-- CARD 3 -->

    <!-- CARD 4 -->

     <!-- CARD 5 -->

    <!-- FOOTER -->
    <div class="footer">
      <div class="footer-title">Follow Us</div>

      <div class="social-icons">
        <!-- Instagram -->
        <a href="https://instagram.com/" target="_blank">
          <i class="bi bi-instagram"></i>
        </a>

        <!-- TikTok -->
        <a href="https://tiktok.com/" target="_blank">
          <i class="bi bi-tiktok"></i>
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/6281234567890" target="_blank">
          <i class="bi bi-whatsapp"></i>
        </a>
      </div>
    </div>

  </div>

</body>
</html>
